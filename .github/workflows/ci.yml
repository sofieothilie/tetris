name: C++ CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cmake ninja-build libsdl2-dev
      
      - name: Check formatting
        run: |
          clang-format --dry-run --Werror \
            src/main.cpp src/system/*.cpp src/include/*.hpp

      - name: Configure
        run: |
          cmake -S . \
                -B build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          cmake --build build --parallel

      # - name: Test
      #   run: |
      #     ctest --test-dir build --output-on-failure
